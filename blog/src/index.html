<!DOCTYPE html>
<html lang="en" class="overflow-x-hidden">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chan179 — Technical Notes</title>
    <meta name="description" content="Technical notes and learning resources on Math, Golang, System Design, ML, and more.">
    <link rel="icon" type="image/png" href="/favicon.png">

    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Chan179">
    <meta property="og:title" content="Chan179 — Technical Notes">
    <meta property="og:description" content="Technical notes and learning resources on Math, Golang, System Design, ML, and more.">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Chan179 — Technical Notes">
    <meta name="twitter:description" content="Technical notes and learning resources on Math, Golang, System Design, ML, and more.">

    <!-- Tailwind CSS (Local Build) -->
    <link href="/css/output.css" rel="stylesheet">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
        rel="stylesheet">

    <!-- Cloudflare Web Analytics -->
    <script defer src='https://static.cloudflareinsights.com/beacon.min.js'
        data-cf-beacon='{"token": "dc2db16f28b54096b53f7a070b0f56d3"}'></script>

    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.8/dist/cdn.min.js"
        integrity="sha384-X9kJyAubVxnP0hcA+AMMs21U445qsnqhnUF8EBlEpP3a42Kh/JwWjlv2ZcvGfphb"
        crossorigin="anonymous"></script>

    <!-- Marked.js -->
    <script src="https://cdn.jsdelivr.net/npm/marked@11.1.1/marked.min.js"
        integrity="sha384-zbcZAIxlvJtNE3Dp5nxLXdXtXyxwOdnILY1TDPVmKFhl4r4nSUG1r8bcFXGVa4Te"
        crossorigin="anonymous"></script>

    <!-- KaTeX for Math Formulas -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css"
        integrity="sha384-n8MVd4RsNIU0tAv4ct0nTaAbDJwPJzDEaqSD1odI+WdtXRGWt2kTvGFasHpSy3SV" crossorigin="anonymous">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"
        integrity="sha384-XjKyOOlGwcjNTAIQHIpgOno0Hl1YQqzUOEleOLALmuqehneUG+vnGctmUb0ZY0l8"
        crossorigin="anonymous"></script>

    <!-- Mermaid.js for Diagrams -->
    <script defer src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"
        integrity="sha384-WmdflGW9aGfoBdHc4rRyWzYuAjEmDwMdGdiPNacbwfGKxBW/SO6guzuQ76qjnSlr"
        crossorigin="anonymous"></script>

    <!-- Highlight.js for Syntax Highlighting -->
    <!-- defer: downloaded in parallel with parsing, executed after DOM is ready.
         Safe because renderCodeBlocks() is only called from a MutationObserver
         callback triggered by Alpine (also deferred), so hljs is always ready in time. -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css"
        integrity="sha384-oaMLBGEzBOJx3UHwac0cVndtX5fxGQIfnAeFZ35RTgqPcYlbprH9o9PUV/F8Le07" crossorigin="anonymous">
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"
        integrity="sha384-F/bZzf7p3Joyp5psL90p/p89AZJsndkSoGwRpXcZhleCWhd8SnRuoYo4d0yirjJp"
        crossorigin="anonymous"></script>
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/go.min.js"
        integrity="sha384-WmGkHEmwSI19EhTfO1nrSk3RziUQKRWg3vO0Ur3VYZjWvJRdRnX4/scQg+S2w1fI"
        crossorigin="anonymous"></script>
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/python.min.js"
        crossorigin="anonymous"></script>
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/rust.min.js"
        crossorigin="anonymous"></script>
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/sql.min.js"
        crossorigin="anonymous"></script>
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/bash.min.js"
        crossorigin="anonymous"></script>
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/typescript.min.js"
        crossorigin="anonymous"></script>
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/yaml.min.js"
        crossorigin="anonymous"></script>
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/json.min.js"
        crossorigin="anonymous"></script>
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/cpp.min.js"
        crossorigin="anonymous"></script>
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/java.min.js"
        crossorigin="anonymous"></script>

    <!-- Custom Styles -->
    <link rel="stylesheet" href="/css/styles.css">
</head>

<body class="bg-gray-50 font-sans overflow-x-hidden" x-data="portfolioApp()">

    <!-- Dark mode init: apply before paint to prevent flash -->
    <script>
        (function () {
            const stored = localStorage.getItem('darkMode');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (stored === 'true' || (stored === null && prefersDark)) {
                document.documentElement.classList.add('dark');
            }
        })();
    </script>

    <!-- Mobile Header -->
    <div x-show="!isLanding"
        class="lg:hidden fixed top-0 left-0 right-0 h-16 bg-white dark:bg-gray-900 border-b border-gray-200 dark:border-gray-700 z-50 flex items-center px-4 gap-4">
        <button @click="mobileMenuOpen = !mobileMenuOpen" class="p-2 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-lg flex-shrink-0">
            <svg class="w-6 h-6 text-gray-700 dark:text-gray-200" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16">
                </path>
            </svg>
        </button>

        <!-- Mobile Search Bar -->
        <div class="flex-1 min-w-0 relative" @click.away="closeSearch()">
            <div class="relative">
                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                    <svg class="h-4 w-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                    </svg>
                </div>
                <input type="text" x-model="searchQuery" @input.debounce.300ms="performSearch()"
                    @focus="isSearchOpen = true" @keydown.escape="closeSearch()"
                    class="block w-full pl-10 pr-3 py-2 border border-gray-200 rounded-lg leading-5 bg-gray-50 text-gray-900 placeholder-gray-400 focus:outline-none focus:bg-white focus:ring-1 focus:ring-blue-500 focus:border-blue-500 sm:text-sm transition duration-150 ease-in-out"
                    placeholder="Search...">
            </div>

            <!-- Search Results Dropdown -->
            <div x-show="isSearchOpen && searchQuery.length > 0" x-transition:enter="transition ease-out duration-100"
                x-transition:enter-start="transform opacity-0 scale-95"
                x-transition:enter-end="transform opacity-100 scale-100"
                x-transition:leave="transition ease-in duration-75"
                x-transition:leave-start="transform opacity-100 scale-100"
                x-transition:leave-end="transform opacity-0 scale-95"
                class="absolute left-0 right-0 mt-2 bg-white rounded-lg shadow-xl border border-gray-200 overflow-hidden z-50 max-h-[70vh] overflow-y-auto"
                style="display: none;">

                <template x-if="searchResults.length === 0">
                    <div class="p-4 text-center text-sm text-gray-500">
                        No results found for "<span x-text="searchQuery" class="font-medium text-gray-900"></span>"
                    </div>
                </template>

                <template x-for="(result, index) in searchResults" :key="index">
                    <a :href="result.link" @click.prevent="navigateToSearchResult(result.link)"
                        class="block p-4 hover:bg-gray-50 border-b border-gray-100 last:border-0 transition duration-150">
                        <div class="flex items-center justify-between mb-1">
                            <span class="text-xs font-semibold text-blue-600 uppercase tracking-wider"
                                x-text="result.category"></span>
                            <span class="text-xs text-gray-400" x-text="result.page"></span>
                        </div>
                        <h4 class="text-sm font-medium text-gray-900 mb-1"
                            x-html="highlightText(result.title, searchQuery)"></h4>
                        <p class="text-xs text-gray-500 line-clamp-2"
                            x-html="highlightText(result.snippet, searchQuery)"></p>
                    </a>
                </template>
            </div>
        </div>

        <!-- Dark Mode Toggle (mobile) -->
        <button @click="toggleDarkMode()" class="p-2 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-lg flex-shrink-0" aria-label="Toggle dark mode">
            <!-- Sun icon (shown in dark mode) -->
            <svg x-show="isDark" class="w-5 h-5 text-yellow-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707M17.657 17.657l-.707-.707M6.343 6.343l-.707-.707M12 8a4 4 0 100 8 4 4 0 000-8z"/>
            </svg>
            <!-- Moon icon (shown in light mode) -->
            <svg x-show="!isDark" class="w-5 h-5 text-gray-500 dark:text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>
            </svg>
        </button>
    </div>

    <!-- Desktop Header -->
    <header x-show="!isLanding"
        class="hidden lg:flex fixed top-0 left-0 right-0 h-16 bg-white dark:bg-gray-900 border-b border-gray-200 dark:border-gray-700 z-50 items-center justify-between">
        <!-- Left: Logo -->
        <div class="flex items-center w-64 pl-6">
            <div class="font-bold text-xl text-gray-900 dark:text-white">Chandra</div>
        </div>

        <!-- Middle: Search Bar -->
        <div class="flex-1 min-w-0">
            <div class="max-w-3xl mx-auto px-6 w-full">
                <div class="relative w-full" @click.away="closeSearch()">
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <svg class="h-4 w-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                            </svg>
                        </div>
                        <input type="text" x-model="searchQuery" @input.debounce.300ms="performSearch()"
                            @focus="isSearchOpen = true" @keydown.escape="closeSearch()"
                            class="block w-full pl-10 pr-3 py-2 border border-gray-200 rounded-lg leading-5 bg-gray-50 text-gray-900 placeholder-gray-400 focus:outline-none focus:bg-white focus:ring-1 focus:ring-blue-500 focus:border-blue-500 sm:text-sm transition duration-150 ease-in-out"
                            placeholder="Search...">
                    </div>

                    <!-- Search Results Dropdown -->
                    <div x-show="isSearchOpen && searchQuery.length > 0"
                        x-transition:enter="transition ease-out duration-100"
                        x-transition:enter-start="transform opacity-0 scale-95"
                        x-transition:enter-end="transform opacity-100 scale-100"
                        x-transition:leave="transition ease-in duration-75"
                        x-transition:leave-start="transform opacity-100 scale-100"
                        x-transition:leave-end="transform opacity-0 scale-95"
                        class="absolute left-0 right-0 mt-2 bg-white rounded-lg shadow-xl border border-gray-200 overflow-hidden z-50 max-h-[70vh] overflow-y-auto"
                        style="display: none;">

                        <template x-if="searchResults.length === 0">
                            <div class="p-4 text-center text-sm text-gray-500">
                                No results found for "<span x-text="searchQuery"
                                    class="font-medium text-gray-900"></span>"
                            </div>
                        </template>

                        <template x-for="(result, index) in searchResults" :key="index">
                            <a :href="result.link" @click.prevent="navigateToSearchResult(result.link)"
                                class="block p-4 hover:bg-gray-50 border-b border-gray-100 last:border-0 transition duration-150">
                                <div class="flex items-center justify-between mb-1">
                                    <span class="text-xs font-semibold text-blue-600 uppercase tracking-wider"
                                        x-text="result.category"></span>
                                    <span class="text-xs text-gray-400" x-text="result.page"></span>
                                </div>
                                <h4 class="text-sm font-medium text-gray-900 mb-1"
                                    x-html="highlightText(result.title, searchQuery)"></h4>
                                <p class="text-xs text-gray-500 line-clamp-2"
                                    x-html="highlightText(result.snippet, searchQuery)"></p>
                            </a>
                        </template>
                    </div>
                </div>
            </div>
        </div>

        <!-- Right: Dark mode toggle -->
        <div class="flex items-center justify-end w-64 pr-6">
            <button @click="toggleDarkMode()" class="p-2 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-lg" aria-label="Toggle dark mode">
                <!-- Sun icon (shown in dark mode) -->
                <svg x-show="isDark" class="w-5 h-5 text-yellow-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707M17.657 17.657l-.707-.707M6.343 6.343l-.707-.707M12 8a4 4 0 100 8 4 4 0 000-8z"/>
                </svg>
                <!-- Moon icon (shown in light mode) -->
                <svg x-show="!isDark" class="w-5 h-5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>
                </svg>
            </button>
        </div>
    </header>

    <!-- Left Sidebar (Navigation) -->
    <aside x-show="!isLanding"
        class="fixed top-16 left-0 bottom-0 w-64 bg-white dark:bg-gray-900 overflow-y-auto z-40 transition-transform duration-300 lg:translate-x-0"
        :class="mobileMenuOpen ? 'translate-x-0' : '-translate-x-full lg:translate-x-0'">
        <div class="p-6">
        </div>

        <nav class="px-4 pb-6">
            <!-- Dynamic Navigation Sections -->
            <template x-for="section in navigationData" :key="section.slug">
                <div>
                    <!-- Standalone Page (no dropdown) -->
                    <template x-if="section.standalone">
                        <div class="mb-6">
                            <a :href="`/${section.slug}`" @click.prevent="navigate(section.slug)"
                                class="block px-3 mb-2 text-xs font-semibold uppercase tracking-wider hover:text-gray-900"
                                :class="currentPage === section.slug ? 'text-blue-600' : 'text-gray-500'"
                                x-text="section.name">
                            </a>
                        </div>
                    </template>

                    <!-- Category with Pages (with dropdown) -->
                    <template x-if="!section.standalone">
                        <div class="mb-6">
                            <!-- Section Header (clickable) -->
                            <div class="flex items-center justify-between px-3 mb-2 group">
                                <a :href="`/${section.slug}`" @click.prevent="navigateToCategory(section.slug)"
                                    class="text-xs font-semibold uppercase tracking-wider hover:text-gray-900 flex-1"
                                    :class="isCategoryActive(section.slug) && currentPage === section.slug ? 'text-blue-600' : 'text-gray-500'"
                                    x-text="section.name"></a>
                                <!-- Chevron icon -->
                                <svg @click="toggleSection(section.slug)"
                                    class="w-4 h-4 text-gray-400 transition-transform duration-200 cursor-pointer hover:text-gray-600"
                                    :class="isSectionExpanded(section.slug) ? 'rotate-180' : ''" fill="none"
                                    stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M19 9l-7 7-7-7">
                                    </path>
                                </svg>
                            </div>

                            <!-- Pages (dropdown) -->
                            <div x-show="isSectionExpanded(section.slug)"
                                x-transition:enter="transition ease-out duration-200"
                                x-transition:enter-start="opacity-0 transform -translate-y-2"
                                x-transition:enter-end="opacity-100 transform translate-y-0"
                                x-transition:leave="transition ease-in duration-150"
                                x-transition:leave-start="opacity-100 transform translate-y-0"
                                x-transition:leave-end="opacity-0 transform -translate-y-2">
                                <template x-for="page in section.pages" :key="page.slug">
                                    <div>
                                        <!-- Regular Page (not a folder) -->
                                        <template x-if="!page.isFolder">
                                            <a :href="`/${section.slug}/${page.slug}`"
                                                @click.prevent="navigateToPage(section.slug, page.slug)"
                                                class="nav-link block px-6 py-2 rounded-lg text-sm text-gray-600 hover:bg-gray-50 mb-1"
                                                :class="isPageActive(section.slug, page.slug) ? 'active' : ''">
                                                <span x-text="page.name"></span>
                                            </a>
                                        </template>

                                        <!-- Nested Folder -->
                                        <template x-if="page.isFolder">
                                            <div class="mb-1">
                                                <!-- Folder Header - Now clickable to navigate -->
                                                <div class="flex items-center justify-between px-6 py-2 rounded-lg hover:bg-gray-50">
                                                    <!-- Folder name (clickable - navigates to folder README) -->
                                                    <a :href="`/${section.slug}/${page.slug}`"
                                                    @click.prevent="navigateToFolder(section.slug, page.slug)"
                                                    class="flex-1 text-sm font-medium cursor-pointer"
                                                    :class="isFolderActive(section.slug, page.slug) ? 'text-blue-600' : 'text-gray-700'">
                                                        <span x-text="page.name"></span>
                                                    </a>
                                                    <!-- Chevron icon (only toggles dropdown) -->
                                                    <svg @click="toggleFolder(section.slug, page.slug)"
                                                        class="w-3 h-3 text-gray-400 transition-transform duration-200 cursor-pointer hover:text-gray-600"
                                                        :class="isFolderExpanded(section.slug, page.slug) ? 'rotate-180' : ''"
                                                        fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                                            d="M19 9l-7 7-7-7"></path>
                                                    </svg>
                                                </div>

                                                <!-- Nested Pages -->
                                                <div x-show="isFolderExpanded(section.slug, page.slug)"
                                                    x-transition:enter="transition ease-out duration-200"
                                                    x-transition:enter-start="opacity-0 transform -translate-y-2"
                                                    x-transition:enter-end="opacity-100 transform translate-y-0"
                                                    x-transition:leave="transition ease-in duration-150"
                                                    x-transition:leave-start="opacity-100 transform translate-y-0"
                                                    x-transition:leave-end="opacity-0 transform -translate-y-2"
                                                    class="ml-4">
                                                    <template x-for="subpage in page.pages" :key="subpage.slug">
                                                        <a :href="`/${section.slug}/${page.slug}/${subpage.slug}`"
                                                            @click.prevent="navigateToNestedPage(section.slug, page.slug, subpage.slug)"
                                                            class="nav-link block px-6 py-2 rounded-lg text-sm text-gray-600 hover:bg-gray-50 mb-1"
                                                            :class="isNestedPageActive(section.slug, page.slug, subpage.slug) ? 'active' : ''">
                                                            <span x-text="subpage.name"></span>
                                                        </a>
                                                    </template>
                                                </div>
                                            </div>
                                        </template>
                                    </div>
                                </template>
                            </div>
                        </div>
                    </template>
                </div>
            </template>
        </nav>
    </aside>

    <!-- Overlay for mobile menu -->
    <div x-show="mobileMenuOpen" @click="mobileMenuOpen = false"
        class="fixed inset-0 bg-black bg-opacity-50 z-30 lg:hidden"
        x-transition:enter="transition-opacity ease-linear duration-300" x-transition:enter-start="opacity-0"
        x-transition:enter-end="opacity-100" x-transition:leave="transition-opacity ease-linear duration-300"
        x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0"></div>

    <!-- Main Content Area -->
    <main class="min-h-screen bg-white dark:bg-gray-900 overflow-x-hidden transition-all duration-300"
        :class="isLanding ? 'pt-8' : 'pt-16 lg:ml-64 xl:mr-64'">
        <div class="mx-auto px-4 sm:px-6 py-8 lg:py-12 transition-all duration-300"
            :class="isLanding ? 'max-w-6xl' : 'max-w-3xl'">
            <!-- Loading State -->
            <div x-show="loading" class="flex items-center justify-center py-20">
                <div class="loader"></div>
            </div>

            <!-- Landing Page Card Grid -->
            <section x-show="isLanding && !loading">
                <!-- Filter Bar -->
                <div class="flex flex-wrap items-center gap-2 mb-8">
                    <button @click="setLandingFilter('all')"
                        class="filter-pill"
                        :class="landingFilter === 'all' ? 'filter-pill-active' : ''">All</button>
                    <template x-for="cat in landingCategories" :key="cat.slug">
                        <button @click="setLandingFilter(cat.slug)"
                            class="filter-pill"
                            :class="landingFilter === cat.slug ? 'filter-pill-active' : ''"
                            x-text="cat.label"></button>
                    </template>
                </div>

                <div class="landing-grid" :style="landingGridStyle">
                    <template x-for="card in filteredCards" :key="card.path">
                        <a :href="`/${card.path}`" @click.prevent="navigate(card.path)" class="landing-card">
                            <div class="card-badge-wrapper">
                                <span x-show="card.category" class="card-badge" :class="getCategoryBadgeClass(card.categorySlug)" x-text="card.category"></span>
                            </div>
                            <h3 class="card-title" x-text="card.title"></h3>
                            <p class="card-desc" x-text="card.description || 'No description available.'"></p>
                        </a>
                    </template>
                </div>
            </section>

            <!-- Content -->
            <article x-show="!isLanding && !loading" id="content" class="prose prose-lg prose-blue max-w-none" x-html="content">
            </article>
        </div>
    </main>

    <!-- Right Sidebar (TOC) -->
    <aside x-show="!isLanding" class="hidden xl:block fixed top-16 right-0 bottom-0 w-64 overflow-y-auto bg-white dark:bg-gray-900">
        <div class="p-6">
        </div>
        <nav id="toc" class="px-4 pb-6 space-y-2 text-sm">
            <!-- TOC will be generated here -->
        </nav>
    </aside>

    <!-- Floating Dark Mode Toggle (landing page only) -->
    <button x-show="isLanding" @click="toggleDarkMode()"
        class="fixed bottom-6 right-6 z-50 p-3 rounded-full shadow-lg border border-gray-200 dark:border-gray-600 bg-white dark:bg-gray-800 hover:shadow-xl transition-all duration-200"
        aria-label="Toggle dark mode">
        <svg x-show="isDark" class="w-5 h-5 text-yellow-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707M17.657 17.657l-.707-.707M6.343 6.343l-.707-.707M12 8a4 4 0 100 8 4 4 0 000-8z"/>
        </svg>
        <svg x-show="!isDark" class="w-5 h-5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>
        </svg>
    </button>

    <!-- CRITICAL: Load JavaScript modules in correct order -->
    
    <!-- 0. Load utilities first (used by other modules) -->
    <script src="/js/utils.js"></script>
    
    <!-- 1. Load module classes first (they define classes used by app.js) -->
    <script src="/js/router.js"></script>
    <script src="/js/search.js"></script>
    <script src="/js/content-loader.js"></script>
    <script src="/js/toc-generator.js"></script>
    <script src="/js/renderer.js"></script>

    <!-- 2. Load configuration and extensions -->
    <script src="/js/marked-extensions.js"></script>
    <script src="/js/navigation-data.js"></script>

    <!-- 3. Load main app last (it instantiates the module classes) -->
    <script src="/js/app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then((regs) => regs.forEach((r) => r.unregister()));
        }
    </script>
</body>

</html>
